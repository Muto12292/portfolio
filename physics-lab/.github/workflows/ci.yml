name: Graviton CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build Engine & Benchmark Target
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Execute 100k-Tick Benchmark
        run: |
          cd build
          ctest --output-on-failure || ./bin/graviton_benchmark || ./bin/Release/graviton_benchmark.exe
